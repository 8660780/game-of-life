<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game of Life - Standard</title>
    <style>
        body { 
            background-color: #222; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin-top: 30px; 
            font-family: sans-serif; 
        }
        canvas { 
            border: 2px solid #555; 
            background-color: black; 
            box-shadow: 0 0 15px rgba(0,0,0,0.8); 
            cursor: pointer; 
        }
        .controls { 
            margin-top: 20px; 
            display: flex; 
            gap: 15px; 
            align-items: center; 
            background: #333; 
            padding: 15px; 
            border-radius: 8px; 
        }
        button, select { 
            padding: 8px 15px; 
            cursor: pointer; 
            background-color: #4CAF50; 
            color: white; 
            border: none; 
            border-radius: 4px; 
        }
        button:hover { background-color: #45a049; }
        button#resetBtn { background-color: #f44336; }
        .speed-control { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
    </style>
</head>
<body>
    <h2>Conway's Game of Life</h2>
    <canvas id="gameCanvas" width="600" height="600"></canvas>
    
    <div class="controls">
        <button id="startBtn">Play</button>
        <button id="stepBtn">Step</button>
        <button id="resetBtn">Clear Grid</button>
        
        <select id="patternSelect">
            <option value="none">-- Load Pattern --</option>
            <option value="glider">Glider</option>
            <option value="blinker">Blinker</option>
            <option value="block">Block</option>
        </select>
        
        <div class="speed-control">
            <label for="speedRange">Speed:</label>
            <input type="range" id="speedRange" min="10" max="500" value="100" dir="rtl">
        </div>
    </div>
    
    <script type="module" src="main.js"></script>
</body>
</html>
